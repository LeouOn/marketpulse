[project]
name = "marketpulse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "psycopg[binary]>=3.2.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "alpaca-py>=0.35.0",
    "aiohttp>=3.11.0",
    "pandas>=2.2.3",
    "numpy>=2.1.2",
    "openai>=1.60.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "schedule>=1.2.2",
    "loguru>=0.7.3",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "websockets>=14.0",
    "yfinance>=0.2.51",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "TCH",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    # Live tests hit real network/API endpoints (FRED, EIA, Yahoo, etc.).
    # Skipped by default; opt in via `RUN_LIVE_TESTS=1` env var.
    # Used by T11 (MacroFactorProvider Sahm validation against real UNRATE).
    "live: marks tests that hit live external APIs (skipped unless RUN_LIVE_TESTS=1)",
    # E2E smoke tests require BOTH the FastAPI backend (port 8000) AND the
    # Next.js frontend (port 3000) to be running. Skipped by default; opt in
    # via `pytest --run-e2e` OR `RUN_E2E=1 pytest ...`.
    # Used by T25 (Metis SC6: 12 multi-asset smoke tests).
    "e2e: marks tests as end-to-end smoke (requires running API + frontend servers; opt in via --run-e2e or RUN_E2E=1)",
]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
