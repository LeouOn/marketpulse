# Configuration for MarketPulse
# Copy this file to credentials.yaml and add your actual API keys

# Database Configuration
database:
  host: localhost
  port: 5432
  database: marketpulse
  username: marketpulse
  password: marketpulse_password

# Redis Cache Configuration
redis:
  host: localhost
  port: 6379
  db: 0
  password: ""

# API Keys - Add your actual keys here
api_keys:
  # Alpaca - Stock market data
  alpaca:
    key_id: your_alpaca_key_here
    secret_key: your_alpaca_secret_here
    base_url: https://paper-api.alpaca.markets/v2

  # Rithmic - Futures data (NQ)
  rithmic:
    username: your_rithmic_username
    password: your_rithmic_password
    system_name: your_system_name
    login_prefix: your_login_prefix

  # Coinbase - Cryptocurrency data
  coinbase:
    api_key: your_coinbase_api_key
    api_secret: your_coinbase_secret
    passphrase: your_coinbase_passphrase

  # OpenRouter - LLM fallback
  openrouter:
    api_key: your_openrouter_api_key

  # MiniMax - LLM cloud option
  minimax:
    api_key: your_minimax_api_key

# LLM Configuration
llm:
  # Primary: LM Studio (local)
  primary:
    base_url: http://localhost:1234/v1
    api_key: not-needed
    timeout: 300

  # Fallback: OpenRouter
  fallback:
    base_url: https://openrouter.ai/api/v1
    api_key: ${api_keys:openrouter:api_key}
    timeout: 60

  # MiniMax Cloud (DEFAULT provider)
  minimax:
    base_url: https://minimax.io
    api_key: ${api_keys:minimax:api_key}
    timeout: 60
    model: MiniMax-M3

  # DeepSeek — Primary cloud reasoning engine
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    timeout: 120
    model_pro: deepseek-v4-pro
    model_flash: deepseek-v4-flash

  # Model routing — which model serves each capability
  # DEFAULT: MiniMax-M3 via minimax.io (international coding plan)
  # Override with LLM_PROVIDER=deepseek|minimax|lm_studio|openrouter
  model_routing:
    primary_provider: minimax          # minimax | deepseek | lm_studio | openrouter
    fallback_providers: deepseek,lm_studio,openrouter
    reasoning: MiniMax-M3              # Multi-step analysis, hypothesis testing
    fast: MiniMax-M3                   # Quick checks, data validation
    standard: MiniMax-M3               # Default chat / analysis
    structured_output: MiniMax-M3      # Function calling, JSON schema

# Market Settings
markets:
  nq:
    symbol: NQ=F
    timezone: America/New_York
    trading_hours: "09:30-16:00"
    tick_size: 0.25
    tick_value: 5.00

  btc:
    symbol: BTC-USD
    timezone: UTC
    trading_hours: 24/7
    tick_size: 1.0
    tick_value: 1.0

  eth:
    symbol: ETH-USD
    timezone: UTC
    trading_hours: 24/7
    tick_size: 0.01
    tick_value: 0.01

# Analysis Settings
analysis:
  internals_interval: 60
  llm_analysis_interval: 300

  alert_thresholds:
    volatility_spike: 2.0
    volume_spike: 3.0
    momentum_shift: 0.5

# API Authentication
# Comma-separated list of valid API keys for authentication
# Leave empty to disable authentication
api_keys_list: "your-api-key-1,your-api-key-2"

# Logging
logging:
  level: INFO
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  rotation: 10 MB
  retention: 30 days