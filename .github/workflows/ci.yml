name: CI

on:
  push:
    branches: [main, opencode/**]
  pull_request:
    branches: [main, opencode/**]

jobs:
  test-python:
    name: Python tests + lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.9

      - name: Lint with ruff (F, E9, B, I -- pinned)
        run: |
          python -m ruff check src/ tests/
          python -m ruff format --check src/ tests/

      - name: Compile + import boot check
        run: |
          python -m compileall -q src scripts
          python -c "import src.api.main"

      # Full suite: the old --ignore list is gone (every one of those
      # files is green since T2a/T2b/T2c landed); -x replaced by --maxfail.
      - name: Run full test suite
        run: python -m pytest tests/ -q --maxfail=20

  test-frontend-build:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: marketpulse-client/package-lock.json

      - name: Install dependencies
        working-directory: marketpulse-client
        run: npm ci || npm install

      - name: Lint
        working-directory: marketpulse-client
        run: npm run lint

      - name: Type-check
        working-directory: marketpulse-client
        run: npx tsc --noEmit

      - name: Build
        working-directory: marketpulse-client
        run: npm run build
